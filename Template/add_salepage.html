{% extends 'homepage.html' %}

{% block body %}
    
<!DOCTYPE html>
<html>
<head>
    <title>Form for make a sele table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #e0f7fa, #f1f8e9);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            width: 400px;
            text-align: center;
        }

        .form-container h2 {
            color: #2e7d32;
            margin-bottom: 20px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-top: 10px;
            color: #444;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #bbb;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus {
            border-color: #4caf50;
            box-shadow: 0 0 5px rgba(76,175,80,0.5);
        }

        input[type="submit"] {
            margin-top: 20px;
            padding: 12px 30px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        button[type="submit"]:hover {
            background: #388e3c;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Sale Entry Form</h2>
        <form action="" method="POST">
            {% csrf_token %}
            <label for="p_name">Product Name</label>
            <input type="text" id="p_name" name="p_name" placeholder="Product Name">

            <label for="catagory">Category</label>
            <input type="text" id="catagory" name="catagory" placeholder="Category type">

            <label for="unit_price">Unit Price</label>
            <input type="number" id="unit_price" name="unit_price" placeholder="Unit price">

            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" name="quantity" placeholder="Quantity">

            <label for="discount">Discount (%)</label>
            <input type="number" id="discount" name="discount" placeholder="Discount percent">

            <label for="tax_percent">Tax (%)</label>
            <input type="number" id="tax_percent" name="tax_percent" placeholder="Tax percent">

            <label for="sale_date">Sale Date</label>
            <input type="date" id="sale_date" name="sale_date">

            <button type="submit" value="Submit">Submit</button>
        </form>
    </div>
</body>
</html>

    

{% endblock body %}
